; ===========================================================================
;  Anycubic Filament Reader - PlatformIO project
;  Uses the pioarduino fork of the espressif32 platform (required for current
;  ESP32-C6 / Arduino-ESP32 3.x support).
;
;  The "stable" platform URL always resolves to pioarduino's latest tested
;  release, so the toolchain stays current without pinning a version that may
;  later 404 or go stale. To lock a specific version for reproducible builds,
;  replace "stable" in each URL with a tagged version, e.g. "55.03.37".
;
;  One environment per board. Exactly one BOARD_* flag is defined per env;
;  BoardConfig.h and Pins.h key all board-specific facts off that flag.
;
;  Build a specific board, e.g.:
;     pio run -e xiao_c6
;     pio run -e xiao_c6 -t upload
; ===========================================================================

[platformio]
default_envs = esp32dev

; ---- Shared settings inherited by every environment -----------------------
[env]
framework = arduino
monitor_speed = 115200

; Library Dependency Finder mode. "chain" is the default: it follows #include
; directives in this project's own sources AND honors the dependency lists in
; each module's library.json. That combination is enough to resolve the
; cross-module includes here (RFIDReader -> Events/FilamentTag, Display ->
; FilamentTag), because those modules declare those dependencies explicitly in
; their library.json.
;
; We deliberately do NOT use "deep" / "deep+": those modes crawl the manifests
; of third-party libraries too, which makes the finder discover ElegantOTA's
; *declared* AsyncTCP + ESPAsyncWebServer dependencies and try to compile them.
; Those async libraries reference core headers (Network.h, NetworkInterface.h)
; in a way that breaks against the current Arduino-ESP32 3.x core and fails the
; build -- even though this project never uses async (see lib_ignore below).
lib_ldf_mode = chain

; ElegantOTA must run in async-free mode here because WebService uses the sync
; WebServer (not ESPAsyncWebServer). This define selects that backend so
; ElegantOTA's own source includes the sync headers, not the async ones.
build_flags =
    -D ELEGANTOTA_USE_ASYNC_WEBSERVER=0

; Belt-and-suspenders: even though "chain" mode will not pull these in, we also
; hard-block the async stack so no LDF mode change or transitive manifest can
; ever drag them into a sync-only project. ElegantOTA declares both as
; dependencies; this project satisfies OTA through the sync WebServer instead.
lib_ignore =
    AsyncTCP
    ESPAsyncWebServer

lib_deps =
    miguelbalboa/MFRC522 @ ^1.4.2
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit SSD1306 @ ^2.5.9
    bblanchon/ArduinoJson @ ^7.0.4
    ayushsharma82/ElegantOTA @ ^3.1.6

; A default-partitioned ESP32 reserves a large SPIFFS region, leaving little
; room for the application. WiFi + web server + OTA + the OLED/RFID libraries
; push this build past that smaller app slot. The min_spiffs scheme shrinks the
; filesystem partition and enlarges the two OTA app partitions, which is what
; this firmware needs (it stores no large files on flash).
board_build.partitions = min_spiffs.csv

; The filament tables live in a JSON file in the flash filesystem so they can be
; edited via the web UI. Use LittleFS (more robust than SPIFFS, handles power
; loss better). Upload the data/ folder with: pio run -t uploadfs
board_build.filesystem = littlefs

; ===========================================================================
;  Seeed XIAO ESP32-C6
; ===========================================================================
[env:xiao_c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32c6
build_flags =
    ${env.build_flags}
    -D BOARD_XIAO_ESP32C6

; ===========================================================================
;  ESP32-C3 (generic devkit)
; ===========================================================================
[env:esp32c3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c3-devkitm-1
build_flags =
    ${env.build_flags}
    -D BOARD_ESP32C3

; ===========================================================================
;  ESP32-S3 (generic devkitc-1)
; ===========================================================================
[env:esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -D BOARD_ESP32S3

; ===========================================================================
;  Classic ESP32 (DOIT DevKit V1 / WROOM-32)
; ===========================================================================
[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
build_flags =
    ${env.build_flags}
    -D BOARD_ESP32DEV
